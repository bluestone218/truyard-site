backend:
  name: github
  repo: bluestone218/truyard-site
  branch: main

media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "products"
    label: "Products"
    folder: "src/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Series"
        name: "series"
        widget: "select"
        options: ["Hawke", "Eagle", "CM", "C", "PRX"]
      - { label: "Tagline", name: "tagline", widget: "string" }
      - { label: "Photo", name: "image", widget: "image", required: false }
      - label: "Specs"
        name: "specs"
        widget: "list"
        fields:
          - { label: "Label", name: "key", widget: "string" }
          - { label: "Value", name: "value", widget: "string" }
      - { label: "Description", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Other Pages"
    files:
      - label: "Site Settings"
        name: "site_settings"
        file: "src/_data/site.json"
        fields:
          - { label: "Company name", name: "name", widget: "string" }
          - { label: "Company legal name", name: "company", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Mobile", name: "mobile", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Line ID", name: "line", widget: "string" }
          - label: "Navigation Links"
            name: "nav"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
